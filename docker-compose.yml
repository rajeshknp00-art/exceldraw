version: "3.8"

services:
  # Backend API
  api:
    build: ./backend
    container_name: triage-api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/triage
      - JWT_SECRET=your-jwt-secret-key-change-in-production
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend:/app

  # Database
  db:
    image: postgres:15
    container_name: triage-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=triage
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Redis (for caching, rate limiting)
  redis:
    image: redis:7-alpine
    container_name: triage-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # Frontend
  frontend:
    build: ./frontend
    container_name: triage-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      - api

  # RAG Service (optional - for embedding/search)
  rag-service:
    image: milvusdb/milvus:2.3.3
    container_name: triage-rag
    restart: unless-stopped
    environment:
      - MILVUS_ROOT_PASSWORD=root
      - MILVUS_DEFAULT_DB_NAME=triage
    ports:
      - "19530:19530"
    depends_on:
      - redis

volumes:
  postgres_data: